databases:
  - name: vero-postgres
    databaseName: vero_booking
    user: vero_user
    plan: free

services:
  - type: web
    name: vero-patient-booking
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vero-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
